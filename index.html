<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Snake With Power-Ups</title>
  </head>
  <body>
    <main class="app">
      <h1>Snake With Power-Ups</h1>
      <div class="hud">
        <div class="hud-score">
          <span class="hud-label">Score</span>
          <span id="score" class="hud-value">0</span>
        </div>
        <div id="effect" class="hud-effect" hidden>
          <span id="effect-name" class="effect-name"></span>
          <div
            id="effect-bar"
            class="effect-bar"
            role="progressbar"
            aria-label="Effect time left"
            aria-valuemin="0"
            aria-valuemax="100"
          >
            <div id="effect-fill" class="effect-fill"></div>
          </div>
        </div>
      </div>
      <div class="board-wrap">
        <canvas id="board" aria-label="Snake game board"></canvas>
        <div id="overlay" class="overlay" hidden></div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
