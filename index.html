<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Snake With Power-Ups</title>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <h1>Snake With Power-Ups</h1>
        <button id="open-scores" type="button" class="secondary">High scores</button>
      </header>
      <div class="hud">
        <div class="hud-scores">
          <div class="hud-score">
            <span class="hud-label">Score</span>
            <span id="score" class="hud-value">0</span>
          </div>
          <div class="hud-score">
            <span class="hud-label">Best</span>
            <span id="best" class="hud-value hud-best">0</span>
          </div>
        </div>
        <div id="effect" class="hud-effect" hidden>
          <span id="effect-name" class="effect-name"></span>
          <div
            id="effect-bar"
            class="effect-bar"
            role="progressbar"
            aria-label="Effect time left"
            aria-valuemin="0"
            aria-valuemax="100"
          >
            <div id="effect-fill" class="effect-fill"></div>
          </div>
        </div>
      </div>
      <div id="board-wrap" class="board-wrap" tabindex="-1">
        <canvas id="board" aria-label="Snake game board"></canvas>
        <div id="overlay" class="overlay" hidden></div>
      </div>
      <div id="dpad" class="dpad" role="group" aria-label="Direction pad">
        <button type="button" class="dpad-up" data-dir="up" aria-label="Up">▲</button>
        <button type="button" class="dpad-left" data-dir="left" aria-label="Left">◀</button>
        <button id="dpad-pause" type="button" class="dpad-pause" data-paused="false" disabled>Pause</button>
        <button type="button" class="dpad-right" data-dir="right" aria-label="Right">▶</button>
        <button type="button" class="dpad-down" data-dir="down" aria-label="Down">▼</button>
      </div>
    </main>

    <div id="announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

    <dialog id="scores-panel" class="panel" aria-labelledby="scores-title">
      <h2 id="scores-title">High scores</h2>
      <table class="scores-table">
        <thead>
          <tr>
            <th scope="col">#</th>
            <th scope="col">Score</th>
            <th scope="col">Date</th>
          </tr>
        </thead>
        <tbody id="scores-body"></tbody>
      </table>
      <p id="scores-empty" class="scores-empty">No scores yet. Play a game!</p>
      <div id="panel-actions" class="panel-actions">
        <button id="clear-scores" type="button" class="secondary">Clear scores</button>
        <button id="close-scores" type="button">Close</button>
      </div>
      <div id="confirm-clear" class="confirm" hidden>
        <p>Clear all high scores? This can't be undone.</p>
        <div class="panel-actions">
          <button id="confirm-no" type="button" class="secondary">Cancel</button>
          <button id="confirm-yes" type="button" class="danger">Clear</button>
        </div>
      </div>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
